[package]
name = "glass-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Glass terminal-native development and browser workspace"
license.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords = ["browser-automation", "development-runtime", "mcp", "tui"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "glass"
path = "src/main.rs"
doc = false

[[bin]]
name = "glass-browser"
path = "src/browser_main.rs"
doc = false

[dependencies]
glass-browser = { version = "=0.3.3", path = "../glass-browser", features = ["development-runtime"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
