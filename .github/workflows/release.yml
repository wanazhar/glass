name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install release audit tools
        run: cargo install cargo-deny cargo-audit --locked

      - name: Generate dependency, license, and vulnerability reports
        shell: bash
        run: |
          mkdir -p dist/validation
          cargo deny --format json check --audit-compatible-output > dist/validation/cargo-deny.jsonl
          cargo audit --json > dist/validation/cargo-audit.json

      - name: Install managed Chrome for benchmark evidence
        shell: bash
        run: |
          chrome_path="$(cargo run --release --locked -- install-chromium | sed -n 's/^Chrome for Testing installed at //p')"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Generate ratified benchmark evidence
        shell: bash
        env:
          GLASS_DISABLE_CHROME_SANDBOX: "1"
          GLASS_BENCH_ITERATIONS: "50"
          GLASS_BENCH_EXPENSIVE_ITERATIONS: "50"
          GLASS_SCORECARD_ITERATIONS: "100"
        run: |
          mkdir -p dist/validation
          cargo run --release --locked --example benchmark > dist/validation/benchmark.json
          cargo run --release --locked --example scorecard > dist/validation/scorecard.json
          cargo test --locked mcp::server::tests::
          python3 scripts/derive-ratified-metrics.py \
            dist/validation/benchmark.json \
            dist/validation/scorecard.json \
            --mcp-survival-rate 1.0 \
            --mcp-raw-report 'cargo test --locked mcp::server::tests::' \
            --output dist/validation/ratified-metrics.json
          echo "GLASS_RATIFIED_METRICS=$(jq -c .metrics dist/validation/ratified-metrics.json)" >> "$GITHUB_ENV"
          echo "GLASS_RATIFIED_RAW_REPORTS=$(jq -c .raw_reports dist/validation/ratified-metrics.json)" >> "$GITHUB_ENV"
          echo "GLASS_RATIFIED_PASSED=$(jq -r .passed dist/validation/ratified-metrics.json)" >> "$GITHUB_ENV"

      - name: Generate release validation evidence
        run: |
          scripts/generate-validation-evidence.sh dist/validation
          python3 scripts/check-reliability-matrix.py dist/validation/reliability-matrix.json
          python3 scripts/check-knowledge-migration.py \
            --binary target/release/glass \
            --output dist/validation/knowledge-migration.json

      - name: Verify clean install and upgrade
        env:
          GLASS_PREVIOUS_VERSION: "0.1.18"
        run: scripts/smoke-clean-install.sh

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TypeScript client against release binary
        working-directory: clients/typescript
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/release/glass
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          node smoke.mjs
          npm pack --dry-run

      - name: Validate Python client against release binary
        working-directory: clients/python
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/release/glass
        run: |
          python3 -m pip wheel --no-deps . -w "$RUNNER_TEMP/glass-python-wheel"
          python3 smoke.py

      - name: Validate npm launcher package
        working-directory: clients/npm
        run: npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: release-validation-evidence
          path: |
            dist/validation/benchmark.json
            dist/validation/scorecard.json
            dist/validation/ratified-metrics.json
            dist/validation/ratified-gates.json
            dist/validation/release-validation.json
            dist/validation/reliability-matrix.json
            dist/validation/knowledge-migration.json
            dist/validation/cargo-deny.jsonl
            dist/validation/cargo-audit.json
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: glass-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: glass-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: glass-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: glass-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-targets --locked --target ${{ matrix.target }}

      - name: Install managed Chrome for browser smoke
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo run --release --locked -- install-chromium

      - name: Install system Chromium for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
          chrome_path="$(command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Install bubblewrap for Linux sandbox gate
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Run browser smoke
        shell: bash
        env:
          GLASS_E2E: "1"
          GLASS_RELIABILITY_EVIDENCE_DIR: ${{ github.workspace }}/dist/reliability
          # GitHub's hosted Linux runner does not expose Chrome's sandbox.
          # Keep the production default secure and scope this exception here.
          GLASS_DISABLE_CHROME_SANDBOX: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
        run: |
          mkdir -p dist
          set -o pipefail
          cargo test --test browser_smoke --locked -- --nocapture --test-threads=1 2>&1 \
            | tee "dist/${{ matrix.artifact }}-browser-smoke.log"

      - uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.artifact }}
          path: dist/reliability
          if-no-files-found: error

      - name: Run native extension sandbox gate
        shell: bash
        env:
          GLASS_EXTENSION_SANDBOX_E2E: "1"
          GLASS_EXTENSION_SANDBOX_KIND: ${{ startsWith(matrix.os, 'ubuntu') && 'linux-bubblewrap' || 'macos-sandbox-exec' }}
        run: |
          set -o pipefail
          cargo test --lib --locked sandboxed_reference_extensions_pass_native_gate -- --nocapture 2>&1 \
            | tee "dist/${{ matrix.artifact }}-extension-sandbox.log"
          python3 scripts/write-extension-sandbox-evidence.py \
            --target "${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'linux-x86-64' || matrix.target == 'aarch64-unknown-linux-gnu' && 'linux-arm64' || matrix.target == 'x86_64-apple-darwin' && 'macos-x86-64' || 'macos-arm64' }}" \
            --sandbox "$GLASS_EXTENSION_SANDBOX_KIND" \
            --raw-report "dist/${{ matrix.artifact }}-extension-sandbox.log" \
            --output "dist/sandbox-${{ matrix.artifact }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.artifact }}
          path: |
            dist/sandbox-${{ matrix.artifact }}.json
            dist/${{ matrix.artifact }}-extension-sandbox.log
          if-no-files-found: error

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/glass dist/${{ matrix.artifact }}
          strip dist/${{ matrix.artifact }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          else
            shasum -a 256 dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          fi

      - name: Smoke packaged browser and TUI
        shell: bash
        env:
          GLASS_RELEASE_BROWSER_SMOKE: "1"
          GLASS_DISABLE_CHROME_SANDBOX: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
        run: |
          set -o pipefail
          scripts/smoke-release-binary.sh "dist/${{ matrix.artifact }}" 2>&1 \
            | tee "dist/${{ matrix.artifact }}-packaged-browser-smoke.log"
          python3 scripts/smoke-packaged-tui.py "dist/${{ matrix.artifact }}"

      - name: Collect packaged artifact contract evidence
        env:
          GLASS_ARTIFACT_NAME: ${{ matrix.artifact }}
          GLASS_PLATFORM_TARGET: ${{ matrix.target }}
        run: python3 scripts/collect-contract-evidence.py \
          "dist/${{ matrix.artifact }}" \
          "dist/contract-${{ matrix.artifact }}.json"

      - name: Write packaged browser platform evidence
        env:
          GLASS_PLATFORM_ARTIFACT: dist/${{ matrix.artifact }}
          GLASS_PLATFORM_TARGET: ${{ matrix.target }}
          GLASS_ARTIFACT_NAME: ${{ matrix.artifact }}
          GLASS_PLATFORM_CHROME: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'system-chromium' || format('managed-chromium-{0}', matrix.target) }}
          GLASS_PLATFORM_RAW_REPORT: ${{ matrix.artifact }}-packaged-browser-smoke.log
          GLASS_PLATFORM_SMOKE_COMMAND: cargo test --test browser_smoke --locked -- --nocapture --test-threads=1
        run: python3 scripts/write-platform-evidence.py "dist/platform-${{ matrix.artifact }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksum
          path: dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.artifact }}
          path: |
            dist/platform-${{ matrix.artifact }}.json
            dist/${{ matrix.artifact }}-packaged-browser-smoke.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.artifact }}
          path: dist/contract-${{ matrix.artifact }}.json
          if-no-files-found: error

  acceptance:
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install managed Chrome for acceptance
        shell: bash
        run: |
          chrome_path="$(cargo run --release --locked -- install-chromium | sed -n 's/^Chrome for Testing installed at //p')"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: release-validation-evidence
          path: evidence/validation

      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: evidence/platform
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: evidence/contract
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: reliability-*
          path: evidence/reliability

      - uses: actions/download-artifact@v4
        with:
          pattern: sandbox-*
          path: evidence/sandbox

      - name: Merge revision-bound prerequisites
        run: |
          python3 scripts/merge-platform-evidence.py \
            evidence/platform-matrix.json \
            evidence/platform/platform-*.json
          python3 scripts/merge-contract-evidence.py \
            evidence/contract-matrix.json \
            evidence/contract/contract-*.json
          python3 scripts/verify-artifact-evidence.py \
            evidence/platform-matrix.json \
            evidence/contract-matrix.json
          python3 scripts/merge-reliability-evidence.py \
            evidence/reliability-matrix.json \
            evidence/reliability
          python3 scripts/merge-extension-sandbox-evidence.py \
            evidence/sandbox-matrix.json \
            evidence/sandbox

      - name: Certify native reliability matrix
        run: |
          python3 scripts/certify-reliability-matrix.py \
            evidence/reliability-matrix.json \
            --scenarios tests/fixtures/reliability-capability-suite-v1.json \
            --binary target/release/glass \
            --version "${GITHUB_REF_NAME#v}" \
            --output evidence/reliability-scorecards.json

      - name: Run bounded competitive acceptance
        shell: bash
        env:
          GLASS_DISABLE_CHROME_SANDBOX: "1"
          GLASS_SCORECARD_ITERATIONS: "100"
          GLASS_ACCEPTANCE_COMMAND_TIMEOUT_MS: "900000"
          GLASS_ACCEPTANCE_OUTPUT_DIR: dist/acceptance
          GLASS_RATIFIED_GATES_REPORT: ${{ github.workspace }}/evidence/validation/ratified-gates.json
          GLASS_RELEASE_VALIDATION_REPORT: ${{ github.workspace }}/evidence/validation/release-validation.json
          GLASS_PLATFORM_MATRIX_REPORT: ${{ github.workspace }}/evidence/platform-matrix.json
        run: node benchmarks/run-acceptance.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            dist/acceptance
            evidence/reliability-matrix.json
            evidence/reliability-scorecards.json
            evidence/sandbox-matrix.json
          if-no-files-found: error

  client-compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: glass-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: glass-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: glass-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: glass-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Prepare exact target artifact
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.artifact }}"
          echo "GLASS_BINARY=${{ github.workspace }}/dist/${{ matrix.artifact }}" >> "$GITHUB_ENV"
          "dist/${{ matrix.artifact }}" --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TypeScript client against exact artifact
        working-directory: clients/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          node smoke.mjs
          npm pack --dry-run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python client against exact artifact
        working-directory: clients/python
        run: |
          python3 -m pip wheel --no-deps . -w "$RUNNER_TEMP/glass-python-wheel"
          python3 smoke.py

      - name: Validate npm launcher against exact artifact
        shell: bash
        run: |
          npm_root="$RUNNER_TEMP/glass-npm-${{ matrix.target }}"
          mkdir -p "$npm_root/package" "$npm_root/install"
          npm pack --ignore-scripts --pack-destination "$npm_root/package" ./clients/npm >/dev/null
          npm_tar="$(find "$npm_root/package" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$npm_tar"
          GLASS_SKIP_DOWNLOAD=1 npm install --prefix "$npm_root/install" \
            --ignore-scripts --no-audit --no-fund "$npm_tar"
          native_binary="$npm_root/install/node_modules/@glass-browser/cli/bin/glass-native"
          cp "$GLASS_BINARY" "$native_binary"
          chmod +x "$native_binary"
          "$npm_root/install/node_modules/.bin/glass" --version
          "$npm_root/install/node_modules/.bin/glass" capabilities >/dev/null

  install-compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify isolated install and upgrade
        env:
          GLASS_PREVIOUS_VERSION: "0.1.18"
        run: scripts/smoke-clean-install.sh

  release:
    needs: [build, validate, acceptance, client-compatibility, install-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: glass-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: evidence/platform
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: evidence/contract
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-validation-evidence
          path: evidence/validation

      - uses: actions/download-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/acceptance

      - name: Merge release evidence
        run: |
          python3 scripts/merge-platform-evidence.py \
            dist/platform-matrix.json \
            evidence/platform/platform-*.json
          python3 scripts/merge-contract-evidence.py \
            dist/contract-matrix.json \
            evidence/contract/contract-*.json
          python3 scripts/verify-artifact-evidence.py \
            dist/platform-matrix.json \
            dist/contract-matrix.json
          python3 scripts/verify-downloaded-artifacts.py \
            dist/contract-matrix.json \
            dist
          cp evidence/validation/ratified-gates.json dist/ratified-gates.json
          cp evidence/validation/release-validation.json dist/release-validation.json
          cp evidence/validation/knowledge-migration.json dist/knowledge-migration.json
          cp evidence/validation/benchmark.json dist/benchmark.json
          cp evidence/validation/scorecard.json dist/scorecard.json
          cp evidence/validation/ratified-metrics.json dist/ratified-metrics.json
          cp evidence/validation/cargo-deny.jsonl dist/cargo-deny.jsonl
          cp evidence/validation/cargo-audit.json dist/cargo-audit.json
          cp evidence/acceptance/acceptance.json dist/acceptance.json
          cp evidence/acceptance/environment.json dist/acceptance-environment.json
          cp evidence/acceptance/reliability-matrix.json dist/reliability-matrix.json
          cp evidence/acceptance/reliability-scorecards.json dist/reliability-scorecards.json
          cp evidence/acceptance/sandbox-matrix.json dist/sandbox-matrix.json
          cp -R evidence/acceptance/raw dist/acceptance-raw

      - name: Verify artifact checksums
        shell: bash
        run: |
          for checksum in dist/*.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Create checksum manifest
        shell: bash
        run: |
          sha256sum \
            dist/glass-linux-x86_64 \
            dist/glass-linux-arm64 \
            dist/glass-macos-x86_64 \
            dist/glass-macos-aarch64 \
            > dist/SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign checksum manifest with Sigstore
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS

      - name: Verify Sigstore bundle
        run: |
          cosign verify-blob \
            --bundle dist/SHA256SUMS.bundle \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
