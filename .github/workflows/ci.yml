name: CI

on:
  push:
  pull_request:

jobs:
  browser-free-platforms:
    name: Browser-free ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check both product packages
        run: |
          cargo check --package glass-browser --all-targets --all-features --locked
          cargo check --package glass-dev --all-targets --all-features --locked
      - name: Run glass-dev browser-free contract tests
        run: cargo test --package glass-dev --all-targets --all-features --locked -- --nocapture
      - name: Run glass-browser browser-free contract tests
        run: cargo test --package glass-browser --all-targets --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: scripts/check-rust-workspace.sh clippy

      - name: Run tests
        run: scripts/check-rust-workspace.sh test

      - name: Install native development fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
          rustup component add rust-analyzer

      - name: Prove real LSP and Neovim embed paths
        run: |
          cargo test --package glass-browser --features development-runtime development::language::tests::rust_analyzer_publishes_real_diagnostics_when_available -- --exact
          cargo test --package glass-browser --features development-runtime development::neovim::tests::real_neovim_probe_proves_pty_and_rpc_modes_when_available -- --exact

      - name: Check package version synchronization
        run: python3 scripts/check-version-sync.py

      - name: Validate release truth and feature parity
        run: python3 scripts/check-feature-parity.py

      - name: Validate release documentation
        run: python3 scripts/check-release-documentation.py

      - name: Validate documentation inventories and links
        run: python3 scripts/check-documentation-coverage.py

      - name: Validate documentation depth and command tree
        run: python3 scripts/check-documentation-depth.py

      - name: Validate deterministic reliability matrix
        run: python3 scripts/check-reliability-matrix.py

      - name: Validate public read-only adapter inventory
        run: python3 scripts/check-public-readonly-adapters.py

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Validate package and fuzz workspace
        run: |
          cargo package --package glass-browser --locked --allow-dirty --no-verify
          cargo package --package glass-dev --locked --allow-dirty --no-verify \
            --config 'patch.crates-io.glass-browser.path="crates/glass-browser"'
          version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "glass-dev"))')"
          python3 scripts/check-packaged-dependency.py \
            "target/package/glass-dev-${version}.crate" --version "$version"
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
          cargo check --manifest-path fuzz/Cargo.toml --locked --offline --all-targets

      - name: Install release audit tools
        run: cargo install cargo-deny cargo-audit --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Audit dependencies
        run: cargo audit

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Glass for client smoke tests
        run: cargo build --package glass-dev --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and typecheck TypeScript client
        working-directory: clients/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          npm pack --dry-run

      - name: Run TypeScript client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/debug/glass
        run: node smoke.mjs
        working-directory: clients/typescript

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build Python client wheel
        working-directory: clients/python
        run: python -m pip wheel --no-deps . -w /tmp/glass-python-wheel

      - name: Run Python client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/debug/glass
        run: python smoke.py
        working-directory: clients/python
