<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account preferences</title></head>
<body>
  <div role="form" aria-label="Account preferences" data-widget="custom-form">
    <div class="field">
      <span id="plan-label">Plan</span>
      <div role="combobox" aria-labelledby="plan-label" aria-expanded="false" tabindex="0">Standard</div>
    </div>
    <div class="field">
      <span id="updates-label">Product updates</span>
      <div role="checkbox" aria-labelledby="updates-label" aria-checked="false" tabindex="0"></div>
    </div>
    <div role="button" aria-disabled="true" data-action="save">Save preferences</div>
  </div>
</body>
</html>
