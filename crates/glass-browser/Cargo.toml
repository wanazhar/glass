[package]
name = "glass-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local browser intelligence runtime with semantic memory, verified workflows, multi-surface understanding, CLI, TUI, MCP, and Rust APIs"
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/glass-browser"
homepage.workspace = true
repository.workspace = true
autobins = false
keywords = ["browser-automation", "chrome", "cdp", "mcp", "browser-control"]
categories = ["api-bindings", "command-line-utilities", "development-tools::testing"]

exclude = ["tests/fixtures/screenshots/"]

[[bin]]
name = "glass-browser"
path = "src/main.rs"
doc = false

[lib]
name = "glass_browser"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
visual-compare = []
fuzzing = []

[dependencies]
base64 = "0.22"
tokio = {
    version = "1",
    features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"],
}
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
fs2 = "0.4"
imagesize = { version = "0.15", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
base64-simd = "0.8"
