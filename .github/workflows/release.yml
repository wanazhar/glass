name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: glass-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: glass-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: glass-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-targets --locked --target ${{ matrix.target }}

      - name: Install managed Chrome for browser smoke
        run: cargo run --release --locked -- install-chromium

      - name: Run browser smoke
        run: GLASS_E2E=1 cargo test --test browser_smoke --locked -- --nocapture

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/glass dist/${{ matrix.artifact }}
          strip dist/${{ matrix.artifact }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          else
            shasum -a 256 dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksum
          path: dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: glass-*
          path: dist
          merge-multiple: true

      - name: Verify artifact checksums
        shell: bash
        run: |
          for checksum in dist/*.sha256; do
            sha256sum -c "$checksum"
          done

      - name: Create checksum manifest
        shell: bash
        run: |
          sha256sum \
            dist/glass-linux-x86_64 \
            dist/glass-macos-x86_64 \
            dist/glass-macos-aarch64 \
            > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
