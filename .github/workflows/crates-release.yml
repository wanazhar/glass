# This workflow publishes the crates.io package and creates a source-only
# GitHub Release with generated notes. It does not build or publish native
# release binaries, checksum bundles, provenance bundles, or npm assets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked crate to crates.io
        required: true
        default: false
        type: boolean
      verify_release_records:
        description: Verify all published and retained failed GitHub release tags
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      already_published: ${{ steps.publication.outputs.already_published }}
      ci_run_id: ${{ steps.exact_ci.outputs.run_id }}
      fuzz_run_id: ${{ steps.exact_fuzz.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" == *-* ]]; then
            echo "Refusing prerelease tag ${GITHUB_REF_NAME}; publish only stable vX.Y.Z tags." >&2
            exit 1
          fi
          cargo metadata --no-deps --locked --format-version 1 | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          packages = {p["name"]: p["version"] for p in data["packages"] if p["name"] in {"glass-browser", "glass-dev"}}
          expected = os.environ["TAG_VERSION"].removeprefix("v")
          if set(packages.values()) != {expected}:
              raise SystemExit(f"package versions {packages} do not match tag {expected}")
          '
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Verify signed tag and substantive release source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          tag_verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.verified)"
          if [[ "$tag_verified" != "true" ]]; then
            reason="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.reason)"
            echo "GitHub does not verify $GITHUB_REF_NAME: $reason" >&2
            exit 1
          fi
          crate_version="${GITHUB_REF_NAME#v}"
          python3 scripts/generate-release-notes.py \
            --version "$crate_version" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-list -n 1 "$GITHUB_REF_NAME")" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/glass-release-notes-validation.md"

      - name: Reject prerelease package versions
        shell: bash
        run: |
          cargo metadata --no-deps --locked --format-version 1 | python3 -c '
          import json, sys
          packages = {p["name"]: p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] in {"glass-browser", "glass-dev"}}
          prereleases = {name: version for name, version in packages.items() if "-" in version}
          if prereleases:
              raise SystemExit(f"Refusing to publish prerelease packages: {prereleases}")
          '

      - name: Locate exact-source green CI certification
        id: exact_ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --commit "$expected_sha" \
              --json databaseId,headSha,status,conclusion,event --limit 50 \
              | python3 -c 'import json,sys; sha=sys.argv[1]; runs=json.load(sys.stdin); matches=[r for r in runs if r["headSha"] == sha and r["event"] == "push" and r["status"] == "completed" and r["conclusion"] == "success"]; print(matches[0]["databaseId"] if matches else "")' "$expected_sha")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            if [[ "$attempt" != 30 ]]; then
              sleep 10
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "no completed green CI run found for exact source $expected_sha" >&2
            exit 1
          fi
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact-source CI certification
        uses: actions/download-artifact@v4
        with:
          name: ci-certification-${{ steps.exact_ci.outputs.sha }}
          path: ${{ runner.temp }}/glass-ci-certification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.exact_ci.outputs.run_id }}

      - name: Download exact-source documentation audit
        uses: actions/download-artifact@v4
        with:
          name: release-doc-audit-${{ steps.exact_ci.outputs.sha }}
          path: ${{ runner.temp }}/glass-release-documentation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.exact_ci.outputs.run_id }}

      - name: Verify exact-source CI certification
        env:
          EXPECTED_SHA: ${{ steps.exact_ci.outputs.sha }}
          EXPECTED_RUN_ID: ${{ steps.exact_ci.outputs.run_id }}
        run: |
          python3 - "$RUNNER_TEMP/glass-ci-certification/ci-certification.json" \
            "$RUNNER_TEMP/glass-release-documentation/glass-release-documentation.json" \
            "$EXPECTED_SHA" "$EXPECTED_RUN_ID" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          certification_path, report_path, expected_sha, expected_run_id = sys.argv[1:]
          certification = json.loads(Path(certification_path).read_text(encoding="utf-8"))
          report = json.loads(Path(report_path).read_text(encoding="utf-8"))
          required_jobs = {
              "test",
              "clients",
              "Browser-free ubuntu-latest",
              "Browser-free macos-latest",
              "Browser-free windows-latest",
          }
          if certification.get("git_sha") != expected_sha:
              raise SystemExit("CI certification SHA does not match the release source")
          if str(certification.get("run_id")) != expected_run_id:
              raise SystemExit("CI certification run ID does not match the selected run")
          if certification.get("event") != "push":
              raise SystemExit("release certification must come from a push run")
          if set(certification.get("required_jobs", [])) != required_jobs:
              raise SystemExit("CI certification job set is incomplete")
          documentation_report = certification.get("documentation_report", {})
          if not report.get("passed") or report.get("current_claim_count") != 0:
              raise SystemExit("CI documentation certification contains current claims")
          if documentation_report.get("sha256") != hashlib.sha256(
              Path(report_path).read_bytes()
          ).hexdigest():
              raise SystemExit("documentation audit hash does not match CI certification")
          for key in (
              "document_count",
              "current_document_count",
              "previous_version",
              "previous_version_hit_count",
              "semantic_audit_hit_count",
              "current_claim_count",
          ):
              if documentation_report.get(key) != (
                  len(report["previous_version_hits"])
                  if key == "previous_version_hit_count"
                  else report.get(key)
              ):
                  raise SystemExit(f"documentation audit field does not match: {key}")
          print(f"exact-source CI certification verified: {expected_sha} / run {expected_run_id}")
          PY

      - name: Locate exact-source green fuzz certification
        id: exact_fuzz
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ steps.exact_ci.outputs.sha }}"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow fuzz.yml --commit "$expected_sha" \
              --json databaseId,headSha,status,conclusion,event --limit 50 \
              | python3 -c 'import json,sys; sha=sys.argv[1]; runs=json.load(sys.stdin); matches=[r for r in runs if r["headSha"] == sha and r["event"] == "push" and r["status"] == "completed" and r["conclusion"] == "success"]; print(matches[0]["databaseId"] if matches else "")' "$expected_sha")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            if [[ "$attempt" != 30 ]]; then
              sleep 10
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "no completed green fuzz run found for exact source $expected_sha" >&2
            exit 1
          fi
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact-source fuzz certification
        uses: actions/download-artifact@v4
        with:
          name: fuzz-certification-${{ steps.exact_fuzz.outputs.sha }}
          path: ${{ runner.temp }}/glass-fuzz-certification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.exact_fuzz.outputs.run_id }}

      - name: Verify exact-source fuzz certification
        env:
          EXPECTED_SHA: ${{ steps.exact_fuzz.outputs.sha }}
          EXPECTED_RUN_ID: ${{ steps.exact_fuzz.outputs.run_id }}
        run: |
          python3 - "$RUNNER_TEMP/glass-fuzz-certification/fuzz-certification.json" \
            "$EXPECTED_SHA" "$EXPECTED_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, expected_sha, expected_run_id = sys.argv[1:]
          certification = json.loads(Path(path).read_text(encoding="utf-8"))
          required_targets = {
              "mcp_frame",
              "cdp_message",
              "ax_dom",
              "locator",
              "url_policy",
              "semantic_contracts",
          }
          if certification.get("git_sha") != expected_sha:
              raise SystemExit("fuzz certification SHA does not match the release source")
          if str(certification.get("run_id")) != expected_run_id:
              raise SystemExit("fuzz certification run ID does not match the selected run")
          if set(certification.get("required_targets", [])) != required_targets:
              raise SystemExit("fuzz certification target set is incomplete")
          print(f"exact-source fuzz certification verified: {expected_sha} / run {expected_run_id}")
          PY

      - name: Dry-run crates.io publication
        run: |
          cargo publish --package glass-browser --locked --dry-run --no-verify
          cargo publish --package glass-dev --locked --dry-run --no-verify \
            --config 'patch.crates-io.glass-browser.path="crates/glass-browser"'

      - name: Check crates.io publication state
        id: publication
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          crate_versions="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print("\n".join("{} {}".format(p["name"], p["version"]) for p in json.load(sys.stdin)["packages"] if p["name"] in {"glass-browser", "glass-dev"}))')"
          all_published=true
          while read -r crate_name crate_version; do
            response_file="$RUNNER_TEMP/${crate_name}-${crate_version}.json"
            status="$(curl --silent --show-error --user-agent 'glass-browser-release-ci (+https://github.com/wanazhar/glass)' --output "$response_file" --write-out '%{http_code}' "https://crates.io/api/v1/crates/${crate_name}/${crate_version}")"
            case "$status" in
              200)
                published_version="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["version"]["num"])' < "$response_file")"
                test "$published_version" = "$crate_version"
                echo "crates.io already contains ${crate_name} ${crate_version}; publication will be skipped"
                ;;
              404)
                echo "${crate_name} ${crate_version} is not published; publication will proceed"
                all_published=false
                ;;
              *)
                echo "unexpected crates.io API response for ${crate_name}: HTTP ${status}" >&2
                cat "$response_file" >&2
                exit 1
                ;;
            esac
          done <<< "$crate_versions"
          echo "already_published=${all_published}" >> "$GITHUB_OUTPUT"

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish glass-browser to crates.io
        if: needs.validate.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "glass-browser"))')"
          status="$(curl --silent --show-error --user-agent 'glass-browser-release-ci (+https://github.com/wanazhar/glass)' --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/glass-browser/${crate_version}")"
          if [ "$status" = "404" ]; then cargo publish --package glass-browser --locked; else echo "glass-browser ${crate_version} already published"; fi

      - name: Publish glass-dev to crates.io
        if: needs.validate.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "glass-dev"))')"
          for attempt in $(seq 1 30); do
            browser_status="$(curl --silent --show-error --user-agent 'glass-browser-release-ci (+https://github.com/wanazhar/glass)' --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/glass-browser/${crate_version}")"
            [ "$browser_status" = "200" ] && break
            if [ "$attempt" = "30" ]; then echo "glass-browser ${crate_version} did not become visible" >&2; exit 1; fi
            sleep 10
          done
          status="$(curl --silent --show-error --user-agent 'glass-browser-release-ci (+https://github.com/wanazhar/glass)' --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/glass-dev/${crate_version}")"
          if [ "$status" = "404" ]; then cargo publish --package glass-dev --locked; else echo "glass-dev ${crate_version} already published"; fi

      - name: Smoke-test registry installations
        run: |
          version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "glass-dev"))')"
          scripts/smoke-registry-install.sh "$version"

      - name: Confirm existing crates.io publication
        if: needs.validate.outputs.already_published == 'true'
        run: echo "The tagged crate version is already published on crates.io; no duplicate publication was attempted."

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; no duplicate was attempted"
            exit 0
          fi

          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "glass-dev"))')"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          tag_verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.verified)"
          if [[ "$tag_verified" != "true" ]]; then
            reason="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .verification.reason)"
            echo "GitHub does not verify $GITHUB_REF_NAME: $reason" >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/glass-release-notes.md"
          python3 scripts/generate-release-notes.py \
            --version "$crate_version" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$release_commit" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Glass ${crate_version}" \
            --latest \
            --notes-file "$notes_file"

      - name: Verify GitHub release records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-github-releases.py

  verify-release-records:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_release_records == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Verify GitHub release records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-github-releases.py
