<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Glass Marble</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/logic.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <aside id="rail" aria-label="Main navigation"></aside>
  <div id="workspace">
    <header id="topbar"></header>
    <main id="main" tabindex="-1"></main>
    <div id="composer-area"></div>
  </div>
  <aside id="info-panel" aria-label="Marble info" hidden></aside>
  <nav id="tabs" aria-label="Main navigation"></nav>
  <dialog id="unlock" aria-labelledby="unlock-title">
    <form id="unlock-form">
      <h1 id="unlock-title">Unlock Marble</h1>
      <p>This host needs an access token.</p>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <p id="unlock-error" class="error" role="alert"></p>
      <button type="submit" class="primary">Unlock</button>
    </form>
  </dialog>
</body>
</html>
