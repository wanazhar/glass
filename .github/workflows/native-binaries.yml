name: Native binaries

# Native binaries are an opt-in validation/build artifact. The normal CI and
# crates release workflows intentionally do not build or publish executables.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  native-binaries:
    name: Native binaries ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Rust
        uses: ./.github/actions/setup-ci-rust
        with:
          shared-key: release-size
      - name: Build and smoke-test size-optimized release binaries
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            suffix=".exe"
          else
            suffix=""
          fi

          mkdir -p dist

          cargo build --package glass-dev --bins --profile release-size --locked
          cp "target/release-size/glass${suffix}" "dist/glass${suffix}"
          cp "target/release-size/glass-browser${suffix}" "dist/glass-browser${suffix}"

          for binary in \
            "dist/glass${suffix}" \
            "dist/glass-browser${suffix}"; do
            "${binary}" --version
          done

          sha256sum dist/* > dist/SHA256SUMS
      - name: Upload native binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glass-native-binaries-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
