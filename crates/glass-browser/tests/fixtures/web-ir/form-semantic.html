<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shipping address</title></head>
<body>
  <main>
    <form aria-labelledby="shipping-heading" id="shipping-form">
      <h1 id="shipping-heading">Shipping address</h1>
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" autocomplete="name" required>
      <label for="city">City</label>
      <input id="city" name="city" autocomplete="address-level2" required>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
