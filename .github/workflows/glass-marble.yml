name: Glass Marble

# Marble spans a Rust host and a Swift app, and the app is the one part a Linux
# development loop cannot compile. This workflow keeps both honest: the crate is
# formatted, linted, and tested with the offline fake Core, and the Xcode target
# is built for the simulator on every change that touches it.

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "crates/glass-marble/**"
      - "crates/glass-runtime-client/**"
      - "apps/glass-marble-ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/glass-marble.yml"
  pull_request:
    paths:
      - "crates/glass-marble/**"
      - "crates/glass-runtime-client/**"
      - "apps/glass-marble-ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/glass-marble.yml"

concurrency:
  group: marble-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Marble host
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-marble-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-marble-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-marble-
      - name: Check formatting
        run: cargo fmt -p glass-marble -- --check
      - name: Lint
        run: cargo clippy -p glass-marble --all-targets --locked -- -D warnings
      - name: Test against the offline fake Core
        run: cargo test -p glass-marble --locked

  ios:
    name: Marble iOS
    # The app uses the Liquid Glass APIs behind an iOS 26 availability guard, so
    # it needs an Xcode whose iOS SDK is 26 or newer.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - name: Require an iOS 26 simulator SDK
        run: |
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iphonesimulator SDK: $sdk_version"
          major="${sdk_version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::This Mac needs an Xcode with the iOS 26 SDK; found $sdk_version."
            exit 1
          fi
      - name: Build for the simulator without signing
        run: >
          xcodebuild
          -project apps/glass-marble-ios/GlassMarble.xcodeproj
          -target "Glass Marble"
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
