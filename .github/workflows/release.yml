name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked
      - name: Match release tag to Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "glass") | .version')
          test "$tag" = "v$package_version"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned supply-chain tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-license --version 0.7.0 --locked
      - run: cargo deny check
      - run: cargo audit --json > vulnerability-report.json
      - run: cargo license --json > license-report.json
      - run: cargo metadata --locked --format-version 1 > dependency-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: "*-report.json"

  artifacts:
    needs: [verify, supply-chain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: i686-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Install release-pinned browser
        shell: bash
        run: target/${{ matrix.target }}/release/glass${{ startsWith(matrix.os, 'windows') && '.exe' || '' }} install-chromium --update
      - name: Native browser smoke
        env:
          GLASS_E2E: "1"
        run: cargo test --locked --target ${{ matrix.target }} --test browser_smoke -- --nocapture
      - name: Smoke release CLI
        shell: bash
        run: target/${{ matrix.target }}/release/glass${{ startsWith(matrix.os, 'windows') && '.exe' || '' }} --help
      - name: Package Unix artifact
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/glass-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/glass README.md LICENSE dist/glass-${{ matrix.target }}/
          tar -C dist -czf dist/glass-${{ matrix.target }}.tar.gz glass-${{ matrix.target }}
      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/glass-${{ matrix.target }}
          Copy-Item target/${{ matrix.target }}/release/glass.exe,README.md,LICENSE dist/glass-${{ matrix.target }}/
          Compress-Archive dist/glass-${{ matrix.target }}/* dist/glass-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: glass-${{ matrix.target }}
          path: dist/glass-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  attest:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: glass-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: supply-chain-reports
          path: dist/reports
      - uses: sigstore/cosign-installer@v3
      - name: Create and sign checksums
        working-directory: dist
        run: |
          sha256sum glass-* > SHA256SUMS
          (cd reports && sha256sum *.json) >> SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/glass-*
            dist/reports/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/glass-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/reports/*.json
