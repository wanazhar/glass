<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#0d1117"/>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#e5e7eb}.muted{fill:#94a3b8}.accent{fill:#38bdf8}.green{fill:#4ade80}.purple{fill:#c084fc}.h{font-weight:700}.s{font-size:15px}.m{font-size:18px}.l{font-size:24px}</style>
<rect x="20" y="18" width="1360" height="50" rx="10" fill="#0f172a" stroke="#334155"/><text x="40" y="50" class="accent h l">Glass</text><text x="130" y="49" class="muted m">Compare experiments</text><text x="1080" y="48" class="muted s">experiment/a ⇄ experiment/b</text>
<rect x="20" y="84" width="670" height="536" rx="10" fill="#111827" stroke="#334155"/><text x="40" y="126" class="h m">APPROACH A</text><text x="520" y="126" class="muted s">localhost:3101</text><rect x="45" y="145" width="620" height="245" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="288" y="195" style="fill:#111827;font-size:24px;font-weight:700">Checkout</text><rect x="230" y="250" width="230" height="55" rx="7" fill="#111827"/><text x="293" y="284" style="fill:#f8fafc;font-size:19px;font-weight:700">Continue</text><text x="45" y="432" class="muted s">Files changed</text><text x="620" y="432" class="h s">7</text><text x="45" y="468" class="muted s">Tests</text><text x="590" y="468" class="green h s">81/81 ✓</text><text x="45" y="504" class="muted s">Semantic regressions</text><text x="620" y="504" class="green h s">0</text><text x="45" y="540" class="muted s">Startup</text><text x="575" y="540" class="h s">812 ms</text><text x="45" y="576" class="muted s">Workflow checkout</text><text x="590" y="576" class="green h s">PASS</text>
<rect x="710" y="84" width="670" height="536" rx="10" fill="#111827" stroke="#334155"/><text x="730" y="126" class="h m">APPROACH B</text><text x="1210" y="126" class="muted s">localhost:3102</text><rect x="735" y="145" width="620" height="245" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="978" y="195" style="fill:#111827;font-size:24px;font-weight:700">Checkout</text><rect x="920" y="250" width="230" height="55" rx="7" fill="#1d4ed8"/><text x="983" y="284" style="fill:#f8fafc;font-size:19px;font-weight:700">Continue</text><text x="735" y="432" class="muted s">Files changed</text><text x="1310" y="432" class="h s">4</text><text x="735" y="468" class="muted s">Tests</text><text x="1280" y="468" class="green h s">81/81 ✓</text><text x="735" y="504" class="muted s">Semantic regressions</text><text x="1310" y="504" class="green h s">0</text><text x="735" y="540" class="muted s">Startup</text><text x="1265" y="540" class="h s">701 ms</text><text x="735" y="576" class="muted s">Workflow checkout</text><text x="1280" y="576" class="green h s">PASS</text>
<rect x="20" y="640" width="1360" height="240" rx="10" fill="#0f172a" stroke="#334155"/><text x="40" y="682" class="purple h m">AGENT COMPARISON</text><text x="40" y="726" class="m">Approach B is smaller and starts faster; both preserve semantic contracts.</text><text x="40" y="770" class="accent s">→ visual diff   → code diff   → performance probe</text><text x="40" y="830" class="muted s">[A] choose A  [B] choose B  [D] deep compare  [X] ask agent</text>
</svg>