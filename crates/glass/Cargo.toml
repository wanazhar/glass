[package]
name = "glass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A minimal, fast coding harness."
default-run = "glass"

[[bin]]
name = "glass"
path = "src/main.rs"

[dependencies]
glass-mod-api.workspace = true
glass-tui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
