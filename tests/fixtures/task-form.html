<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Task Form</title></head>
  <body>
    <form aria-label="Checkout" id="checkout">
      <label>Email <input aria-label="Email" name="email"></label>
      <label>Password <input aria-label="Password" name="password" type="password" value="secret"></label>
      <button aria-label="Payment" role="tab" type="button">Payment</button>
      <button aria-label="Confirm order" id="confirm-order" type="button">
        Confirm order
      </button>
      <button aria-label="Submit" type="submit">Submit</button>
      <output aria-label="Result" id="result"></output>
    </form>
    <nav aria-label="Main navigation">
      <button aria-label="Products" aria-haspopup="menu" aria-expanded="false" type="button">Products</button>
      <button aria-label="No-op menu" aria-haspopup="menu" type="button">No-op menu</button>
    </nav>
    <nav aria-label="Pagination">
      <button aria-label="Next page" type="button">Next</button>
    </nav>
    <section aria-label="Results" role="list">
      <a href="/one" role="listitem">First result</a>
      <a href="/two" role="listitem">Second result</a>
    </section>
    <table aria-label="Orders">
      <tr><th>Item</th><th>Status</th></tr>
      <tr><td>First order</td><td>Ready</td></tr>
      <tr><td>Second order</td><td>Pending</td></tr>
    </table>
    <script>
      document.querySelector('#checkout').addEventListener('submit', event => {
        event.preventDefault();
        document.querySelector('#result').textContent = 'submitted';
      });
      document.querySelector('#confirm-order').addEventListener('click', () => {
        setTimeout(() => window.confirm('Confirm order?'), 0);
      });
      const products = document.querySelector('[aria-label="Products"]');
      products.addEventListener('click', () => {
        const expanded = products.getAttribute('aria-expanded') === 'true';
        products.setAttribute('aria-expanded', String(!expanded));
      });
    </script>
  </body>
</html>
