name: Glass Core performance smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "products/glass-core/crates/glass/**"
      - "products/glass-core/crates/glass-tui/**"
      - "products/glass-core/scripts/check-performance.py"
      - "products/glass-core/scripts/smoke-workflow-next.py"
      - "products/glass-core/.github/workflows/performance.yml"
      - ".github/workflows/glass-core-performance.yml"

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/glass-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone engine
        run: cargo build --release --locked --package glass-core --bin glass-core
      - name: Measure startup, terminal interaction, and history reading
        env:
          GLASS_CORE_TEST_BINARY: ${{ github.workspace }}/products/glass-core/target/release/glass-core
          GC_PERF_REPORT: perf-report.json
          GC_PERF_STARTUP_BUDGET_MS: "250"
          GC_PERF_PROMPT_BUDGET_MS: "750"
          GC_PERF_KEY_BUDGET_MS: "200"
          GC_PERF_FRAME_BUDGET_MS: "200"
          GC_PERF_READER_FRAME_BUDGET_MS: "200"
          GC_PERF_HISTORY_BUDGET_MS: "10000"
          GC_PERF_RSS_BUDGET_KIB: "131072"
        run: python3 scripts/check-performance.py
      - name: Measure deterministic coding workflow
        run: python3 scripts/smoke-workflow-next.py > workflow-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-core-performance-${{ github.run_id }}
          path: |
            products/glass-core/perf-report.json
            products/glass-core/workflow-report.json
          if-no-files-found: warn
