name: Parser fuzz smoke

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [mcp_frame, cdp_message, ax_dom, locator, url_policy, semantic_contracts]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Rust
        uses: ./.github/actions/setup-ci-rust
        with:
          toolchain: nightly
          shared-key: fuzz-${{ matrix.target }}
          workspaces: fuzz -> target
          tools: cargo-fuzz@0.13.2
      - name: Run bounded fuzz target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            cargo fuzz run "${FUZZ_TARGET}" "fuzz/corpus/${FUZZ_TARGET}" -- -max_total_time=120
          else
            cargo fuzz run "${FUZZ_TARGET}" "fuzz/corpus/${FUZZ_TARGET}" -- -runs=512
          fi

  release-certification:
    if: github.event_name == 'push'
    needs: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write exact-source fuzz certification
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          certification = {
              "schema_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "git_sha": os.environ["GITHUB_SHA"],
              "required_targets": [
                  "mcp_frame",
                  "cdp_message",
                  "ax_dom",
                  "locator",
                  "url_policy",
                  "semantic_contracts",
              ],
          }
          Path("fuzz-certification.json").write_text(
              json.dumps(certification, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload exact-source fuzz certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-certification-${{ github.sha }}
          path: fuzz-certification.json
          if-no-files-found: error
          retention-days: 30
