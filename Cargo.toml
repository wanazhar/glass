[package]
name = "glass"
version = "0.1.0"
edition = "2024"
description = "Lightweight browser agent for AI — raw CDP, no Playwright"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/glass"
homepage = "https://github.com/wanazhar/glass"
repository = "https://github.com/wanazhar/glass"

[dependencies]
base64 = "0.22"
tokio = {
    version = "1",
    features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"],
}
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
futures-util = "0.3"
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
base64-simd = "0.8"
imagesize = { version = "0.15", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
