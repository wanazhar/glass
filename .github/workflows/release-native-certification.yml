name: Release native certification

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Signed release tag to certify
        required: true
        type: string
      expected_sha:
        description: Commit SHA the tag must resolve to
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-native:
    name: Native Pi, experiments, and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          tag_url="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TARGET_REF}" --jq '.object.url')"
          tag_commit="$(gh api "${tag_url}" --jq '.object.sha')"
          tag_verified="$(gh api "${tag_url}" --jq '.verification.verified')"
          test "${tag_commit}" = "${EXPECTED_SHA}"
          test "${tag_verified}" = "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/pi-runtime/package-lock.json

      - name: Install pinned native Pi SDK
        working-directory: packages/pi-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Certify native Pi SDK and automatic experiments
        env:
          GLASS_PI_SDK_ENTRY: ${{ github.workspace }}/packages/pi-runtime/node_modules/@earendil-works/pi-coding-agent/dist/index.js
        run: |
          cargo test --package glass-dev --lib \
            pi_runtime::tests::native_sdk_starts_and_reports_capabilities_when_installed \
            -- --exact --nocapture
          cargo test --package glass-dev --lib \
            experiments::tests::isolated_worktrees_are_ranked_and_selected_from_evidence \
            -- --exact --nocapture

      - name: Resolve native Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${chrome}"
          echo "GLASS_CHROME_PATH=${chrome}" >> "${GITHUB_ENV}"
          "${chrome}" --version

      - name: Certify live Chromium contracts
        env:
          GLASS_E2E: "1"
          GLASS_DISABLE_CHROME_SANDBOX: "1"
        run: cargo test --package glass-browser --test browser_smoke --locked -- --nocapture --test-threads=1

  windows-native:
    name: Native Windows named-pipe lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          tag_url="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TARGET_REF}" --jq '.object.url')"
          tag_commit="$(gh api "${tag_url}" --jq '.object.sha')"
          tag_verified="$(gh api "${tag_url}" --jq '.verification.verified')"
          test "${tag_commit}" = "${EXPECTED_SHA}"
          test "${tag_verified}" = "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Certify named-pipe reconnect and process-tree cleanup
        run: >-
          cargo test --package glass-dev --test development_runtime --locked
          windows_named_pipe_daemon_lifecycle_reconnect_and_permissions -- --exact --nocapture
