name: Glass Core

on:
  push:
    branches:
      - main
    paths:
      - "products/glass-core/**"
      - "!products/glass-core/**/*.md"
      - "crates/glass-core/**"
      - "crates/glass-mod-api/**"
      - "crates/glass-runtime-client/**"
      - "crates/glass-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-version-sync.py"
      - "scripts/run-smokes.py"
      - "products/glass-core/scripts/ci-smokes.txt"
      - ".github/workflows/glass-core-ci.yml"
      - ".github/actions/setup-ci-rust/**"
  pull_request:
    paths:
      - "products/glass-core/**"
      - "!products/glass-core/**/*.md"
      - "crates/glass-core/**"
      - "crates/glass-mod-api/**"
      - "crates/glass-runtime-client/**"
      - "crates/glass-tui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check-version-sync.py"
      - "scripts/run-smokes.py"
      - "products/glass-core/scripts/ci-smokes.txt"
      - ".github/workflows/glass-core-ci.yml"
      - ".github/actions/setup-ci-rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glass-core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

defaults:
  run:
    working-directory: products/glass-core

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            products/glass-core/package-lock.json
            products/glass-core/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - name: Setup Rust
        uses: ./.github/actions/setup-ci-rust
        with:
          components: clippy
          shared-key: core-release
          tools: nextest
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PTY test dependency
        run: python3 -m pip install pyte==0.8.2
      - name: Test Core crates
        run: |
          cargo nextest run -p glass-core -p glass-mod-api -p glass-runtime-client -p glass-tui --locked
          cargo test -p glass-core -p glass-mod-api -p glass-runtime-client -p glass-tui --doc --locked
      - run: cargo clippy -p glass-core -p glass-mod-api -p glass-runtime-client -p glass-tui --all-targets --locked -- -D warnings
      - run: cargo build --profile core-release --locked --package glass-core --bin glass-core
      - name: Browser workspace checks
        if: runner.os == 'Linux'
        env:
          GLASS_CORE_TEST_BINARY: ${{ github.workspace }}/target/core-release/glass-core
        run: |
          web/node_modules/.bin/playwright-core install --with-deps chromium
          python3 scripts/smoke-connect.py
          python3 scripts/smoke-connect-lifecycle.py
      - name: Installer and offline PTY checks
        env:
          GLASS_CORE_TEST_BINARY: ${{ github.workspace }}/target/core-release/glass-core
        run: |
          python3 ../../scripts/run-smokes.py --jobs "$(nproc)" --manifest scripts/ci-smokes.txt \
            --save-stdout scripts/smoke-workflow-next.py=workflow-report.json
          cargo test -p glass-runtime-client --locked --test runtime -- --ignored
          npm run test --workspace @glass-core/runtime-client
      - name: Measure startup, terminal interaction, and history reading
        if: runner.os == 'Linux'
        env:
          GLASS_CORE_TEST_BINARY: ${{ github.workspace }}/target/core-release/glass-core
          GC_PERF_REPORT: perf-report.json
          GC_PERF_STARTUP_BUDGET_MS: "250"
          GC_PERF_PROMPT_BUDGET_MS: "750"
          GC_PERF_KEY_BUDGET_MS: "200"
          GC_PERF_FRAME_BUDGET_MS: "200"
          GC_PERF_READER_FRAME_BUDGET_MS: "200"
          GC_PERF_HISTORY_BUDGET_MS: "10000"
          GC_PERF_RSS_BUDGET_KIB: "131072"
        run: python3 scripts/check-performance.py
      - name: Upload performance reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: glass-core-performance-${{ github.run_id }}
          path: |
            products/glass-core/perf-report.json
            products/glass-core/workflow-report.json
          if-no-files-found: warn
      - name: Clean install and upgrade
        run: python3 scripts/smoke-upgrade.py
      - name: Package binary
        run: |
          mkdir -p dist/package
          cp "${{ github.workspace }}/target/core-release/glass-core" dist/package/
          ln -s glass-core dist/package/gc
          cp README.md LICENSE THIRD_PARTY.md dist/package/
          python3 -c 'import platform; print("glass-core-" + platform.system().lower() + "-" + platform.machine())' > dist/name
          tar -czf "dist/$(cat dist/name).tar.gz" -C dist/package .
          tar -czf dist/glass-core-web-assets.tar.gz -C web/dist .
          python3 -c 'import hashlib,pathlib; [(p.with_suffix(p.suffix+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")) for p in pathlib.Path("dist").glob("*.tar.gz")]'
      - uses: actions/upload-artifact@v4
        with:
          name: glass-core-${{ matrix.os }}
          path: |
            products/glass-core/dist/*.tar.gz
            products/glass-core/dist/*.sha256
          if-no-files-found: error
