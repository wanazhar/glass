name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-free-platforms:
    name: Browser-free ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUST_MIN_STACK: 4194304
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Install Python for Windows kernel fixtures
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check both product packages
        shell: bash
        run: scripts/check-rust-workspace.sh fast-check
      - name: Install Linux native-engine sandbox prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Build native content worker test prerequisite
        run: cargo build --package glass-browser --features native-engine --bin glass-native-content-worker --locked
      - name: Run native async-effect owner contract tests
        if: runner.os != 'Linux'
        run: |
          cargo test --package glass-browser --lib --features native-engine --locked asynchronous_effect -- --nocapture
          cargo test --package glass-browser --lib --features native-engine --locked async_effect -- --nocapture
          cargo test --package glass-browser --lib --features native-engine --locked dropping_runtime_backend -- --nocapture
      - name: Run native-engine navigation preload process tests
        if: runner.os != 'Linux'
        run: cargo test --package glass-browser --test native_engine --features native-engine --locked navigation_preload -- --nocapture --test-threads=1
      - name: Run glass-dev browser-free contract tests
        run: cargo test --package glass-dev --tests --all-features --locked -- --nocapture
      - name: Certify native Windows named-pipe daemon lifecycle
        if: runner.os == 'Windows'
        run: cargo test --package glass-dev --test development_runtime --locked windows_named_pipe_daemon_lifecycle_reconnect_and_permissions -- --nocapture
      - name: Run glass-browser browser-free contract tests
        run: cargo test --package glass-browser --tests --no-default-features --locked

  native-engine:
    name: Native engine core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_MIN_STACK: 4194304
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache native engine dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ github.job }}-
      - name: Check native engine feature
        run: cargo check --package glass-browser --features native-engine --locked
      - name: Install native-engine sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Build native content worker test prerequisite
        run: cargo build --package glass-browser --features native-engine --bin glass-native-content-worker --locked
      - name: Test native engine feature
        run: cargo test --package glass-browser --features native-engine --tests --locked
      - name: Lint native engine feature
        run: cargo clippy --package glass-browser --features native-engine --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Install native-engine sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Run common source certification
        env:
          GLASS_RELEASE_DOC_REPORT: ${{ runner.temp }}/glass-release-documentation.json
        run: scripts/release-certify.sh

      - name: Install native development fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
          rustup component add rust-analyzer

      - name: Prove real LSP and Neovim embed paths
        run: |
          cargo test --package glass-dev --lib development::language::tests::rust_analyzer_publishes_real_diagnostics_when_available -- --exact
          cargo test --package glass-dev --lib development::neovim::tests::real_neovim_probe_proves_pty_and_rpc_modes_when_available -- --exact

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install pinned native DAP adapters
        run: |
          python -m pip install debugpy==1.8.21
          sudo apt-get install --yes lldb
          mkdir -p "${RUNNER_TEMP}/glass-dap-bin"
          GOBIN="${RUNNER_TEMP}/glass-dap-bin" go install github.com/go-delve/delve/cmd/dlv@v1.27.1

      - name: Certify debugpy, LLDB, and Delve adapters
        run: |
          lldb_dap="$(command -v lldb-dap || command -v lldb-dap-20 || command -v lldb-dap-19 || command -v lldb-dap-18)"
          test -n "${lldb_dap}"
          GLASS_DEBUGPY_PYTHON="$(command -v python)" \
          GLASS_LLDB_DAP="${lldb_dap}" \
          GLASS_DELVE="${RUNNER_TEMP}/glass-dap-bin/dlv" \
            cargo test --package glass-dev --lib debugger::tests::real_ -- --nocapture

      - name: Install release audit tools
        run: cargo install cargo-deny cargo-audit --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Audit dependencies
        run: cargo audit

      - name: Upload release documentation audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-doc-audit-${{ github.sha }}
          path: ${{ runner.temp }}/glass-release-documentation.json
          if-no-files-found: error
          retention-days: 30

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build Glass for client smoke tests
        run: cargo build --package glass-dev --bin glass --locked

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Build and typecheck TypeScript client
        working-directory: clients/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          npm pack --dry-run

      - name: Run TypeScript client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/debug/glass
        run: node smoke.mjs
        working-directory: clients/typescript

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build Python client wheel
        working-directory: clients/python
        run: python -m pip wheel --no-deps . -w /tmp/glass-python-wheel

      - name: Run Python client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/debug/glass
        run: python smoke.py
        working-directory: clients/python

  release-certification:
    if: github.event_name == 'push'
    needs:
      - browser-free-platforms
      - native-engine
      - test
      - clients
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download release documentation audit
        uses: actions/download-artifact@v4
        with:
          name: release-doc-audit-${{ github.sha }}
          path: ${{ runner.temp }}/glass-release-documentation

      - name: Write exact-source CI certification
        env:
          DOC_REPORT: ${{ runner.temp }}/glass-release-documentation/glass-release-documentation.json
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["DOC_REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not report.get("passed") or report.get("current_claim_count") != 0:
              raise SystemExit("release documentation audit is not clean")
          certification = {
              "schema_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "git_sha": os.environ["GITHUB_SHA"],
              "required_jobs": [
                  "test",
                  "clients",
                  "Browser-free ubuntu-latest",
                  "Browser-free macos-latest",
                  "Browser-free windows-latest",
                  "Native engine core",
              ],
              "documentation_report": {
                  "document_count": report["document_count"],
                  "current_document_count": report["current_document_count"],
                  "previous_version": report["previous_version"],
                  "previous_version_hit_count": len(report["previous_version_hits"]),
                  "semantic_audit_hit_count": report["semantic_audit_hit_count"],
                  "current_claim_count": report["current_claim_count"],
                  "sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              },
          }
          Path("ci-certification.json").write_text(
              json.dumps(certification, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload exact-source CI certification
        uses: actions/upload-artifact@v4
        with:
          name: ci-certification-${{ github.sha }}
          path: ci-certification.json
          if-no-files-found: error
          retention-days: 30
