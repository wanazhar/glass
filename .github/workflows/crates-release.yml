# This workflow publishes the crates.io package and creates a source-only
# GitHub Release with generated notes. It does not build or publish native
# release binaries, checksum bundles, provenance bundles, or npm assets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked crate to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.publication.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" == *-* ]]; then
            echo "Refusing prerelease tag ${GITHUB_REF_NAME}; publish only stable vX.Y.Z tags." >&2
            exit 1
          fi
          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "glass-browser"))')"
          test "$tag_version" = "$crate_version"
      - name: Reject prerelease package versions
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "glass-browser"))')"
          if [[ "$crate_version" == *-* ]]; then
            echo "Refusing to publish prerelease package ${crate_version}; use a stable release checkout." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Check package version synchronization
        run: python3 scripts/check-version-sync.py

      - name: Validate release documentation
        run: python3 scripts/check-release-documentation.py

      - name: Validate feature parity
        run: python3 scripts/check-feature-parity.py

      - name: Validate deterministic reliability matrix
        run: python3 scripts/check-reliability-matrix.py

      - name: Validate public read-only adapter inventory
        run: python3 scripts/check-public-readonly-adapters.py

      - name: Validate Web IR corpus and deterministic baseline
        run: python3 scripts/check-web-ir-corpus.py --baseline benchmarks/results/web-ir-v1.json

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Validate the crate package
        run: cargo package --locked --no-verify

      - name: Dry-run crates.io publication
        run: cargo publish --locked --dry-run --no-verify

      - name: Check crates.io publication state
        id: publication
        shell: bash
        env:
          CRATE_NAME: glass-browser
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "glass-browser"))')"
          response_file="$RUNNER_TEMP/crates-release-version.json"
          status="$(curl --silent --show-error --user-agent 'glass-browser-release-ci (+https://github.com/wanazhar/glass)' --output "$response_file" --write-out '%{http_code}' "https://crates.io/api/v1/crates/${CRATE_NAME}/${crate_version}")"

          case "$status" in
            200)
              published_version="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["version"]["num"])' < "$response_file")"
              test "$published_version" = "$crate_version"
              echo "crates.io already contains ${CRATE_NAME} ${crate_version}; publication will be skipped"
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "${CRATE_NAME} ${crate_version} is not published; publication will proceed"
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected crates.io API response: HTTP ${status}" >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate to crates.io
        if: needs.validate.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Confirm existing crates.io publication
        if: needs.validate.outputs.already_published == 'true'
        run: echo "The tagged crate version is already published on crates.io; no duplicate publication was attempted."

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; no duplicate was attempted"
            exit 0
          fi

          crate_version="$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "glass-browser"))')"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "glass-browser ${crate_version}" \
            --latest \
            --generate-notes

      - name: Verify GitHub release records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-github-releases.py
