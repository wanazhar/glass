[advisories]
yanked = "deny"
# Pre-existing transitive unmaintained bincode/yaml-rust notices; informational,
# with no CVSS, and cargo-deny reports no safe upgrade.
ignore = [
  "RUSTSEC-2025-0141",
  "RUSTSEC-2024-0320",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
