[package]
name = "glass-marble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable Glass-backed conversational harness"

[[bin]]
name = "glass-marble"
path = "src/main.rs"

[dependencies]
glass-runtime-client = { path = "../glass-runtime-client", version = "0.3.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pki-types = "1"
ring = "0.17"
base64 = "0.22"
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode-script"] }

[target.'cfg(target_os = "macos")'.dependencies]
toml_edit = "0.25.15"
