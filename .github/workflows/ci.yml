name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Check package version synchronization
        run: python3 scripts/check-version-sync.py

      - name: Validate release truth and feature parity
        run: python3 scripts/check-feature-parity.py

      - name: Validate deterministic reliability matrix
        run: python3 scripts/check-reliability-matrix.py

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Validate package and fuzz workspace
        run: |
          cargo package --locked --allow-dirty --no-verify
          cargo fetch --manifest-path fuzz/Cargo.toml --locked
          cargo check --manifest-path fuzz/Cargo.toml --locked --offline --all-targets

      - name: Install release audit tools
        run: cargo install cargo-deny cargo-audit --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Audit dependencies
        run: cargo audit

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release Glass for client smoke tests
        run: cargo build --release --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and typecheck TypeScript client
        working-directory: clients/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          npm pack --dry-run

      - name: Run TypeScript client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/release/glass
        run: node smoke.mjs
        working-directory: clients/typescript

      - name: Validate npm launcher package
        working-directory: clients/npm
        run: npm pack --dry-run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build Python client wheel
        working-directory: clients/python
        run: python -m pip wheel --no-deps . -w /tmp/glass-python-wheel

      - name: Run Python client handshake smoke test
        env:
          GLASS_BINARY: ${{ github.workspace }}/target/release/glass
        run: python smoke.py
        working-directory: clients/python
