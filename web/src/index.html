<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141916" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>Glass · workspace</title>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Threads">
        <div class="brand">
          <a class="brand-home" href="/" aria-label="Glass home">
            <img src="/icon.svg" alt="" /><span
              >glass<span class="brand-dot">.</span></span
            > </a
          ><button
            class="icon-button"
            id="new"
            title="New thread"
            aria-label="New thread"
          >
            ＋
          </button>
        </div>
        <button
          id="sidebar-close"
          class="icon-button sidebar-close"
          aria-label="Close threads"
        >
          ×
        </button>
        <label class="search"
          ><span>⌕</span
          ><input
            id="search"
            placeholder="Find a thread…"
            aria-label="Find a thread"
          /><kbd>⌘ K</kbd></label
        >
        <div class="project-filter">
          <select
            id="project-scope"
            aria-label="Filter conversations by project"
          >
            <option value="">All projects</option></select
          ><span id="thread-count"></span>
        </div>
        <nav id="threads" aria-label="Conversations"></nav>
        <button id="more-threads" class="quiet hidden" type="button">
          Load older threads
        </button>
        <footer class="sidebar-footer">
          <button type="button" id="notifications" class="quiet">
            Notifications</button
          ><span class="host-dot"></span>
          <div><strong id="host">Connecting</strong><small></small></div>
          <button
            id="theme"
            class="icon-button"
            aria-label="Toggle color theme"
          >
            ◐
          </button>
        </footer>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main class="workspace">
        <header class="toolbar">
          <button
            class="icon-button mobile-menu"
            id="menu"
            aria-label="Show threads"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            ☰
          </button>
          <div class="breadcrumbs">
            <span id="workspace-name">Workspace</span
            ><span class="crumb-separator">/</span
            ><strong id="thread-name">New thread</strong>
          </div>
          <div class="toolbar-actions">
            <button
              type="button"
              id="changes-toggle"
              class="icon-button"
              aria-label="Review changes"
              title="Changes"
            >
              ±
            </button>
            <span id="connection" class="connection"><i></i>Connecting</span
            ><button
              class="icon-button"
              id="files-toggle"
              aria-label="Browse files"
              title="Files"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path d="M3 7V5h7l2 2h9v13H3Z" />
              </svg></button
            ><button
              class="icon-button"
              id="details-toggle"
              title="Thread activity"
              aria-label="Thread activity"
              aria-controls="details"
              aria-expanded="false"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path d="M3 6h18M3 12h18M3 18h12" />
              </svg>
            </button>
          </div>
        </header>
        <div class="conversation" id="conversation">
          <button id="older" class="older hidden">
            ↑ Load earlier activity
          </button>
          <section id="welcome" class="welcome">
            <img class="welcome-mark" src="/icon.svg" alt="" />
            <h1>glass<span>.</span></h1>
            <div class="welcome-actions">
              <button id="welcome-new" class="primary">
                New thread <span>＋</span></button
              ><button id="welcome-files" class="quiet">Open folder</button>
            </div>
          </section>
          <div id="timeline" class="timeline" aria-label="Conversation"></div>
        </div>
        <button id="latest" class="latest hidden">↓ Back to latest</button>
        <section class="compose-zone">
          <div id="notice" class="notice hidden" role="status"></div>
          <div id="interaction" class="interaction hidden"></div>
          <div id="activity" class="activity">
            <span class="activity-dot"></span
            ><span id="activity-text">Ready</span
            ><button id="ownership">Take control</button>
          </div>
          <div
            id="context-chips"
            class="context-chips"
            aria-label="Recent attachments"
          ></div>
          <input type="file" id="attachment-input" multiple hidden />
          <form id="composer" class="composer">
            <textarea
              id="prompt"
              rows="2"
              placeholder="Message…"
              aria-label="Message"
              maxlength="60000"
            ></textarea>
            <div class="composer-bottom">
              <div class="composer-meta">
                <button
                  type="button"
                  id="attach"
                  class="icon-button"
                  aria-label="Attach files"
                  title="Attach files"
                >
                  ＋</button
                ><span id="model">Glass Core</span
                ><span class="meta-divider"></span
                ><span id="profile">Host execution</span>
              </div>
              <div class="composer-actions">
                <button
                  type="button"
                  id="send-mode"
                  class="quiet hidden"
                  data-mode="steer"
                >
                  Steer task
                </button>
                <button
                  type="button"
                  id="stop"
                  class="stop hidden"
                  aria-label="Stop current turn"
                >
                  ■</button
                ><button
                  type="submit"
                  id="send"
                  class="send"
                  aria-label="Send message"
                >
                  ↑
                </button>
              </div>
            </div>
          </form>
          <div class="compose-foot">
            <button
              type="button"
              id="open-commands"
              class="quiet"
              aria-label="Open commands"
            >
              /</button
            ><span id="usage"></span
            ><span class="keyboard-hint"
              >Enter to send <span>·</span> Shift Enter for a new line</span
            >
          </div>
        </section>
      </main>
      <aside class="details" id="details" aria-label="Thread details">
        <header>
          <h2>Thread details</h2>
          <button id="reasoning-latest" class="quiet reasoning-latest" hidden>
            ↓ Latest
          </button>
          <button
            class="icon-button"
            id="details-close"
            aria-label="Close details"
          >
            ×
          </button>
        </header>
        <div class="detail-tabs">
          <button class="selected" data-tab="activity">Activity</button
          ><button data-tab="reasoning">Reasoning</button
          ><button data-tab="context">Context</button
          ><button data-tab="files">Files</button>
        </div>
        <div
          id="detail-content"
          tabindex="0"
          aria-label="Thread detail content"
        ></div>
      </aside>
    </div>
    <dialog id="commands" aria-label="Commands">
      <header>
        <h2 id="commands-title">Commands</h2>
        <button
          type="button"
          id="commands-close"
          class="icon-button"
          aria-label="Close commands"
        >
          ×
        </button>
      </header>
      <input
        id="command-search"
        placeholder="Find a command…"
        aria-label="Find a command"
        autocomplete="off"
      />
      <div id="command-list" role="listbox" aria-label="Commands"></div>
      <footer id="command-help">↑ ↓ select · Enter choose · Esc back</footer>
    </dialog>
    <dialog id="draft-editor" aria-label="Draft editor">
      <header>
        <h2>Draft</h2>
        <button
          type="button"
          id="draft-cancel"
          class="icon-button"
          aria-label="Cancel draft editing"
        >
          ×
        </button>
      </header>
      <textarea id="draft-text" aria-label="Draft text"></textarea>
      <footer>
        <button type="button" id="draft-save" class="command-run">
          Use draft
        </button>
      </footer>
    </dialog>
    <dialog id="animations" aria-label="Working animation">
      <header><h2>Working animation</h2></header>
      <div class="animation-choices">
        <button data-animation="dots">••• Dots</button
        ><button data-animation="pulse">◇ Pulse</button
        ><button data-animation="breathe">◌ Breathe</button
        ><button data-animation="none">— Still</button>
      </div>
    </dialog>
    <dialog id="command-view" aria-label="Command">
      <header>
        <h2 id="command-title">Command</h2>
        <button
          type="button"
          id="command-close"
          class="icon-button"
          aria-label="Close command"
        >
          ×
        </button>
      </header>
      <div id="command-content">
        <div id="command-result"></div>
        <form id="command-form"></form>
      </div>
      <footer id="command-status" role="status"></footer>
    </dialog>
    <dialog id="preview">
      <header>
        <div>
          <span class="eyebrow" id="preview-kind">PREVIEW</span>
          <h2 id="preview-title">Preview</h2>
        </div>
        <div>
          <button id="download" class="quiet">Download</button
          ><button
            id="preview-close"
            class="icon-button"
            aria-label="Close preview"
          >
            ×
          </button>
        </div>
      </header>
      <div id="preview-body"></div>
    </dialog>
    <script nomodule>
      This browser needs JavaScript modules to use Glass.
    </script>
  </body>
</html>
