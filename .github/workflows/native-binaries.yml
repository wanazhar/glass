name: Native binaries

# Native binaries are an opt-in validation/build artifact. The normal CI and
# crates release workflows intentionally do not build or publish executables.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-binaries:
    name: Native binaries ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-binaries-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-binaries-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}-
            ${{ runner.os }}-cargo-native-binaries-
      - name: Build and smoke-test release binaries
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            suffix=".exe"
          else
            suffix=""
          fi

          mkdir -p dist

          cargo build --package glass-dev --bins --release --locked
          cp "target/release/glass${suffix}" "dist/glass${suffix}"
          cp "target/release/glass-browser${suffix}" "dist/glass-browser${suffix}"

          for binary in \
            "dist/glass${suffix}" \
            "dist/glass-browser${suffix}"; do
            "${binary}" --version
          done

          sha256sum dist/* > dist/SHA256SUMS
      - name: Upload native binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glass-native-binaries-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
