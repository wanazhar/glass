[workspace]
resolver = "3"
members = [
    "crates/glass-browser",
    "crates/glass-dev",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.10"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wanazhar/glass"
homepage = "https://github.com/wanazhar/glass"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
