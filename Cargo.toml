[workspace]
resolver = "3"
members = [
    "crates/glass-browser-core",
    "crates/glass-browser",
    "crates/glass-dev",
    "crates/glass-core",
    "crates/glass-mod-api",
    "crates/glass-runtime-client",
    "crates/glass-tui",
]
default-members = [
    "crates/glass-browser-core",
    "crates/glass-browser",
    "crates/glass-dev",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.14"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wanazhar/glass"
homepage = "https://github.com/wanazhar/glass"

[workspace.dependencies]
glass-mod-api = { path = "crates/glass-mod-api", version = "0.3.14" }
glass-tui = { path = "crates/glass-tui", version = "0.3.14" }
zeroize = "1.9"

# Keep the normal edit/build loop light. Use `--profile debugging` when full
# workspace debug information is needed for an interactive debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"

# Glass Core keeps its original size/LTO profile without changing Glass's
# default release profile.
[profile.core-release]
inherits = "release"
opt-level = "s"
lto = "fat"
