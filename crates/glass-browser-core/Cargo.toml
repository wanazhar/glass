[package]
name = "glass-browser-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser-engine core and shared contracts for Glass"
readme = "README.md"
documentation = "https://docs.rs/glass-browser-core"
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
brotli-decompressor = { version = "5.0.0", optional = true, default-features = false, features = ["std"] }
dirs = { version = "6", optional = true }
encoding_rs = { version = "0.8.42", optional = true, default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", optional = true, default-features = false, features = ["fast", "zeroize"] }
fs2 = { version = "0.4", optional = true }
flate2 = { version = "1.1.9", optional = true, default-features = false, features = ["rust_backend"] }
fontdue = { version = "0.9.4", optional = true, default-features = false, features = ["simd", "std"] }
futures-util = { version = "0.3", optional = true }
getrandom = { version = "0.3", optional = true }
gif = { version = "0.14.2", optional = true, default-features = false, features = ["std"] }
harfrust = { version = "0.13.3", optional = true, default-features = false, features = ["std"] }
html5ever = { version = "0.40.0", optional = true }
hmac = { version = "0.12", optional = true }
image-webp = { version = "0.2.4", optional = true }
libc = { version = "0.2", optional = true }
jpeg-encoder = { version = "0.7.1", optional = true, default-features = false, features = ["std"] }
matroska-demuxer = { version = "0.8.1", optional = true }
png = { version = "0.17", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
rquickjs = { version = "0.12.2", optional = true, default-features = false, features = ["std", "futures", "parallel", "loader"] }
serde_json = { version = "1", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
tracing = { version = "0.1", optional = true }
ttf-parser = { version = "0.25.1", optional = true, default-features = false, features = ["std", "variable-fonts"] }
url = { version = "2", optional = true }
webp-rust = { version = "0.3.1", optional = true }
wuff = { version = "0.2.9", optional = true, default-features = false, features = ["brotli"] }
zune-jpeg = { version = "0.5.16-rc2", optional = true, default-features = false, features = ["std"] }
zvidlib-core = { version = "0.5.0", optional = true }
zvidlib-vp8 = { version = "0.5.0", optional = true, default-features = false }

[features]
default = []
native-engine = [
    "dep:aes", "dep:aes-gcm", "dep:base64", "dep:brotli-decompressor", "dep:dirs", "dep:encoding_rs",
    "dep:ed25519-dalek", "dep:flate2", "dep:fontdue", "dep:fs2", "dep:futures-util", "dep:getrandom", "dep:gif",
    "dep:harfrust", "dep:html5ever", "dep:hmac", "dep:image-webp", "dep:jpeg-encoder", "dep:libc", "dep:png",
    "dep:regex", "dep:reqwest", "dep:rquickjs", "dep:serde_json", "dep:sha1", "dep:sha2", "dep:tokio",
    "dep:tokio-tungstenite", "dep:tracing", "dep:ttf-parser", "dep:url", "dep:webp-rust", "dep:wuff", "dep:zune-jpeg",
    "dep:matroska-demuxer", "dep:zvidlib-core", "dep:zvidlib-vp8"
]

[dev-dependencies]
serde_json = "1"
