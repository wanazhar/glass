name: Documentation wiki

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.md"
      - "**/Cargo.toml"
      - "docs/documentation-catalog.json"
      - "scripts/check-documentation-wiki.py"
      - "scripts/tests/test_check_documentation_wiki.py"
      - ".github/workflows/documentation-wiki.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/Cargo.toml"
      - "docs/documentation-catalog.json"
      - "scripts/check-documentation-wiki.py"
      - "scripts/tests/test_check_documentation_wiki.py"
      - ".github/workflows/documentation-wiki.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate documentation catalog and links
        run: python3 scripts/check-documentation-wiki.py

      - name: Test documentation change alerts
        run: python3 scripts/tests/test_check_documentation_wiki.py

      - name: Report changes by topic and section
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python3 scripts/check-documentation-wiki.py --base "$BASE_SHA" --summary
